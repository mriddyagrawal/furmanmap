<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furman Wayfinder — type options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --purple:#582C83; --ink:#1c1b22; --ink-soft:#5c5768; --paper:#fff;
  --field:#f1eff5; --line:#e4e1ea; --muted:#71717a; --dot:#1da1f2;
  --shadow:0 2px 10px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.10);
  --sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --ink:#eceaf1; --ink-soft:#a9a4b6; --paper:#23222a; --field:#2f2e38;
          --line:#383641; --muted:#9a9aa4; --purple:#c9a4ea; }
}
* { box-sizing:border-box }
body { margin:0; padding:18px 14px 60px; background:color-mix(in srgb, var(--paper) 70%, #888 30%);
       font-family:var(--sys); color:var(--ink); }
h1 { font-size:17px; margin:0 0 4px }
.note { font-size:13px; color:var(--ink-soft); margin:0 0 22px; max-width:52ch }
.opt { margin:0 0 30px; }
.label { font:600 12px/1 var(--sys); letter-spacing:.06em; text-transform:uppercase;
         color:var(--ink-soft); margin:0 0 8px; }
.stack { display:flex; flex-direction:column; gap:10px; max-width:420px; }

/* the real components, verbatim */
.searchbar { display:flex; align-items:center; gap:10px; background:var(--paper);
  border-radius:26px; padding:0 14px; height:48px; box-shadow:var(--shadow); }
.searchbar svg { width:20px;height:20px;fill:none;stroke:var(--ink-soft);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none }
.searchbar span { color:var(--muted); font-size:16px; }
.suggest { background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:6px; }
.suggest div { padding:10px 12px; border-radius:10px; }
.suggest .kind { font-size:13px; color:var(--ink-soft); display:block }
.sheet { background:var(--paper); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px 16px; }
.sheet h2 { margin:0 0 3px; font-size:20px; line-height:1.25 }
.sheet .kind { margin:0 0 10px; font-size:13px; color:var(--ink-soft) }
.eta { display:flex; align-items:baseline; gap:8px; margin:0 0 12px }
.eta strong { font-size:26px; color:var(--purple) }
.eta span { font-size:14px; color:var(--ink-soft) }
.btn { display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:46px;border-radius:24px;background:var(--purple);color:#fff;
  font-size:16px;font-weight:600;border:0 }

/* per-option font application */
.ui-sys   { font-family:var(--sys) }
.ui-jost  { font-family:'Jost',var(--sys) }
.ui-outfit{ font-family:'Outfit',var(--sys) }
.ui-figtree{font-family:'Figtree',var(--sys) }
.ui-mont  { font-family:'Montserrat',var(--sys) }
.title-abril h2 { font-family:'Abril Fatface',Georgia,serif; font-weight:400; letter-spacing:.005em }
.title-serif h2 { font-family:'Source Serif 4',Georgia,serif; font-weight:600 }
</style>
</head>
<body>
<h1>Type options — look at this on your phone</h1>
<p class="note">Same components as the real app. Furman's own Abril&nbsp;Text and Brandon&nbsp;Grotesque are
commercially licensed to furman.edu, so these are the free equivalents. Abril&nbsp;Fatface <em>is</em>
Furman's, and is free.</p>

<div id="out"></div>

<script>
const OPTIONS = [
  ['A — system (current)', 'ui-sys', ''],
  ['B — system UI + Abril Fatface title', 'ui-sys', 'title-abril'],
  ['C — Jost (closest to Brandon Grotesque)', 'ui-jost', 'title-abril'],
  ['D — Outfit', 'ui-outfit', 'title-abril'],
  ['E — Figtree', 'ui-figtree', 'title-abril'],
  ['F — Montserrat', 'ui-mont', 'title-abril'],
  ['G — Jost + Source Serif title', 'ui-jost', 'title-serif'],
];
document.getElementById('out').innerHTML = OPTIONS.map(([name, ui, title]) => `
  <section class="opt">
    <p class="label">${name}</p>
    <div class="stack ${ui} ${title}">
      <div class="searchbar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search Furman</span>
      </div>
      <div class="suggest">
        <div>James Buchanan Duke Library<span class="kind">library</span></div>
        <div>Daniel Music Building<span class="kind">university</span></div>
        <div>North Village C<span class="kind">dormitory</span></div>
      </div>
      <div class="sheet">
        <h2>James Buchanan Duke Library</h2>
        <p class="kind">library</p>
        <p class="eta"><strong>4 min</strong><span>310 m away</span></p>
        <button class="btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 11 22 2l-9 19-2-8-8-2Z"/></svg>
          Directions
        </button>
      </div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
